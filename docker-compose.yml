# Development PostgreSQL for the full ATUS database (Phases 1-4).
#
#   docker compose up -d        # from the repository root
#
# The project name is fixed so the data volume resolves to `atus_atus_pgdata`
# from any checkout directory (worktrees, CI, a renamed clone). Never rename
# the project or the volume key: that would start an empty database and orphan
# the ~2 GB loaded one.
#
# This is not the production stack: see docker-compose.prod.yml (API, edge and
# a serving-shaped database) and docker-compose.emulation.yml (free-tier
# CPU/RAM limits).
name: atus

services:
  postgres:
    # postgres:16 (16.15, Debian trixie), pinned by its multi-arch index digest.
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    container_name: atus-postgres
    environment:
      POSTGRES_USER: atus
      POSTGRES_PASSWORD: atus
      POSTGRES_DB: atus
    ports:
      # Loopback only: the superuser and its well-known password are for this
      # machine, never the LAN (audit F32). Host port 5434 so an existing local
      # PostgreSQL on 5432 is never disturbed.
      - "127.0.0.1:5434:5432"
    # Parallel hash joins allocate dynamic shared memory in /dev/shm; Docker's
    # 64 MiB default made concurrent heavy analyses fail with DiskFull (F33).
    shm_size: 1g
    volumes:
      - atus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atus -d atus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  atus_pgdata:
