[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atus-pipeline"
# Single source of truth: atus_pipeline.__version__ (read statically by setuptools).
dynamic = ["version"]
description = "Data foundation for the American Time Use Survey (ATUS) analysis platform: acquisition, validation, transformation, and PostgreSQL loading of official BLS microdata."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "curl_cffi>=0.7",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",       # FastAPI TestClient transport
    "pdfplumber>=0.11",  # only needed to regenerate the activity lexicon reference CSV
    "pyyaml>=6.0",       # tests/deploy reads the GitHub workflow files
]

[project.scripts]
atus = "atus_pipeline.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "atus_pipeline.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that need a running PostgreSQL instance (skipped when unavailable)",
    "data_quality: tests that run against a fully loaded ATUS database (opt-in via ATUS_DATA_QUALITY=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Audit evidence scripts are committed verbatim as run, not maintained code.
extend-exclude = ["docs/evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses Depends()/Query() in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
