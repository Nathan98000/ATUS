# The production stack, locally: the deployed image, roles and database
# settings (docs/adr/ADR-011-hosting.md), published on 127.0.0.1 only.
#
#   cp deploy/stack/stack.env.example .env.stack        # fill in the secrets
#   docker compose --env-file .env.stack -f docker-compose.prod.yml up -d --wait api
#   docker compose --env-file .env.stack -f docker-compose.prod.yml \
#     --profile smoke run --rm smoke --fixture
#   docker compose --env-file .env.stack -f docker-compose.prod.yml down -v
#
# scripts/smoke_stack.sh runs that cycle with throwaway secrets. Add
# `-f docker-compose.emulation.yml` for the free-tier CPU/RAM limits.
#
# Services and what each stands in for:
#   db       Neon Free: Postgres 16 with Neon's settings for the 0.25-2 CU
#            autoscaling compute (deploy/emulation/neon_settings.py), jit=off,
#            and what Neon's console creates: the non-superuser owner
#            `neondb_owner` and the database `atus`
#   restore  (profile `dump`) restores a serving dump as neondb_owner, as the
#            release switch does on Neon
#   seed     unless a serving database is present: loads the fixture dataset
#            into a scratch full database and builds the serving database
#            from it with the real serving builder, as neondb_owner
#   roles    applies scripts/ops/roles.sql as neondb_owner, exactly as the
#            production restore does: the read-only `atus_api` role
#   api      the Render Free web service: the image, with exactly the
#            environment Render sets (docs/deployment.md, Render step 4). Not
#            published on the host: only the edge and the smoke probe reach it
#   snapshot-api  (profile `snapshot`) the same image on the same database
#            with generous per-client limits, published on 127.0.0.1 for
#            scripts/build_snapshot.py only, as CI builds the static snapshot
#   edge     (profile `edge`) the Cloudflare Worker and static assets (the
#            SPA build plus the snapshot) under `wrangler dev` in local mode,
#            in front of the API, published on 127.0.0.1: the public origin
#   smoke    (profile `smoke`) stdlib HTTP checks from inside the stack network
#
# scripts/smoke_stack.sh --edge runs the whole edge cycle (SPA build,
# snapshot, Worker, edge probe; --e2e adds Playwright through the edge).
#
# The project name keeps this stack apart from the development database
# (docker-compose.yml, project `atus`); pass `-p <name>` to run several.
name: atus-stack

x-api-image: &api-image ${ATUS_STACK_IMAGE:-atus-api:local}

# Exactly what the Render service sets, plus ATUS_DATABASE_TLS, the one
# setting Render never has: the stack's Postgres has no TLS, and production
# mode refuses a database URL without sslmode=verify-full unless this escape
# hatch is set, which it accepts only for a local-stack host (`db`,
# `pgbouncer`). Every other setting keeps the API's production default
# (.env.production.example).
x-api-environment: &api-environment
  ATUS_ENV: production
  ATUS_DATABASE_URL: postgresql://atus_api:${ATUS_STACK_API_DB_PASSWORD:?set it in the stack env file (deploy/stack/stack.env.example)}@${ATUS_STACK_API_DB_HOST:-db}:${ATUS_STACK_API_DB_HOST_PORT:-5432}/atus
  ATUS_DATABASE_TLS: local-stack-only
  ATUS_EDGE_SECRETS: ${ATUS_STACK_EDGE_SECRET:?set it in the stack env file (deploy/stack/stack.env.example)}
  ATUS_EXPECTED_DATA_VERSION: ${ATUS_EXPECTED_DATA_VERSION:-}
  ATUS_OPS_TOKEN: ${ATUS_STACK_OPS_TOKEN:?set it in the stack env file (deploy/stack/stack.env.example)}
  WEB_CONCURRENCY: "1"
  PORT: "10000"

services:
  db:
    # postgres:16 (16.15), pinned by its multi-arch index digest; Neon Free
    # runs Postgres 16 too (ADR-011).
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      # The bootstrap superuser only runs deploy/postgres/initdb; nothing in
      # the stack connects as it (Neon gives the owner no superuser either).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ATUS_STACK_PG_SUPERUSER_PASSWORD:?set it in the stack env file (deploy/stack/stack.env.example)}
      POSTGRES_DB: postgres
      ATUS_STACK_OWNER_PASSWORD: ${ATUS_STACK_OWNER_PASSWORD:?set it in the stack env file (deploy/stack/stack.env.example)}
    # Neon's published settings for an autoscaling 0.25-2 CU compute; other
    # compute sizes: python deploy/emulation/neon_settings.py --help.
    # jit=off: Neon builds Postgres without LLVM, the stock image has JIT on,
    # and JIT alone made the 0.25 CU worst case 64-71 s instead of ~52 s (F37).
    command:
      - postgres
      - -c
      - jit=off
      - -c
      - shared_buffers=${ATUS_STACK_DB_SHARED_BUFFERS:-215MB}
      - -c
      - max_connections=${ATUS_STACK_DB_MAX_CONNECTIONS:-839}
      - -c
      - max_worker_processes=${ATUS_STACK_DB_MAX_WORKER_PROCESSES:-17}
      - -c
      - max_parallel_workers=8
    # Parallel hash joins use dynamic shared memory in /dev/shm; Docker's
    # 64 MiB default failed 3 of 5 concurrent trends with DiskFull (F33).
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${ATUS_STACK_DB_PORT-5470}:5432"
    healthcheck:
      # TCP, not the socket: during initdb the image's temporary server
      # answers on the socket only, so this turns healthy after bootstrap.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 60

  restore:
    profiles: ["dump"]
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: neondb_owner
      PGPASSWORD: ${ATUS_STACK_OWNER_PASSWORD:?set it in the stack env file (deploy/stack/stack.env.example)}
      PGDATABASE: atus
    entrypoint: ["sh", "/deploy/stack/restore_dump.sh"]
    volumes:
      - ./deploy:/deploy:ro
      - type: bind
        source: ${ATUS_STACK_DUMP:-./deploy/stack/ATUS_STACK_DUMP-is-not-set}
        target: /seed/serving.dump
        read_only: true
        bind:
          create_host_path: false

  seed:
    image: *api-image
    pull_policy: never  # built by the api service, or pulled by digest beforehand
    depends_on:
      db:
        condition: service_healthy
      restore:
        condition: service_completed_successfully
        required: false
    environment:
      ATUS_SEED_DATABASE_URL: postgresql://neondb_owner:${ATUS_STACK_OWNER_PASSWORD:?set it in the stack env file (deploy/stack/stack.env.example)}@db:5432/atus
      ATUS_SEED_FORCE: ${ATUS_SEED_FORCE:-0}
      # The seed stands in for the owner's loader, which runs from a checkout
      # in development mode; production mode (the image default) is the API's.
      ATUS_ENV: development
      # The installed package has no migrations/ next to it: data commands
      # (and the loader's check that the schema is current) read the mounted
      # ones from here.
      ATUS_MIGRATIONS_DIR: /workspace/migrations
    entrypoint: ["python", "/workspace/deploy/stack/seed_fixture.py"]
    command: []
    # The image carries no migrations, tests or data; mount just what the
    # fixture load needs, read-only.
    volumes:
      - ./deploy:/workspace/deploy:ro
      - ./migrations:/workspace/migrations:ro
      - ./tests:/workspace/tests:ro
      - ./data/reference:/workspace/data/reference:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true

  roles:
    # scripts/ops/roles.sql is the single definition of the API role: its
    # grants (SELECT on the served tables only), its role defaults and the
    # checks that it cannot write. Applied after every seed or restore, as
    # neondb_owner, with the stack's throwaway API password.
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: neondb_owner
      PGPASSWORD: ${ATUS_STACK_OWNER_PASSWORD:?set it in the stack env file (deploy/stack/stack.env.example)}
      PGDATABASE: atus
      ATUS_API_ROLE_PASSWORD: ${ATUS_STACK_API_DB_PASSWORD:?set it in the stack env file (deploy/stack/stack.env.example)}
    entrypoint: ["psql", "-X", "--quiet", "-v", "ON_ERROR_STOP=1", "-f", "/scripts/ops/roles.sql"]
    volumes:
      - ./scripts/ops/roles.sql:/scripts/ops/roles.sql:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true

  api:
    image: *api-image
    # Build locally by default. To run a registry image as is, set
    # ATUS_STACK_IMAGE to its digest reference, ATUS_STACK_PULL_POLICY=missing,
    # and start with --no-build.
    pull_policy: ${ATUS_STACK_PULL_POLICY:-build}
    build:
      context: .
      args:
        ATUS_BUILD_SHA: ${ATUS_BUILD_SHA:-dev}
        ATUS_VERSION: ${ATUS_VERSION:-unknown}
    depends_on:
      roles:
        condition: service_completed_successfully
    environment: *api-environment
    expose:
      - "10000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The image's /health check, polled faster while starting.
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s

  snapshot-api:
    # The static snapshot's source (ADR-015), as CI builds it at each deploy:
    # the API image, read-only on the same database as `api`, with per-client
    # limits generous enough for one client (scripts/build_snapshot.py) to
    # request every metadata route and every prewarmed analysis. Published on
    # 127.0.0.1 for the builder only; visitors never reach it.
    profiles: ["snapshot"]
    image: *api-image
    pull_policy: never
    depends_on:
      roles:
        condition: service_completed_successfully
    environment:
      <<: *api-environment
      ATUS_API_RATE_ANALYSIS: "100000/60"
      ATUS_API_RATE_REQUESTS: "1000000/60"
    ports:
      - "127.0.0.1::10000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s

  edge:
    # The Worker from edge/ under `wrangler dev` (local mode: KV and the
    # Durable Object simulated on disk, no Cloudflare login, no call to
    # Cloudflare), serving the static assets the deploy publishes: the SPA
    # build plus the static snapshot (scripts/smoke_stack.sh --edge prepares
    # both into a directory and sets ATUS_STACK_ASSETS_DIR; plain
    # frontend/dist works too, without a snapshot).
    profiles: ["edge"]
    image: atus-edge:local
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/edge/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Worker secrets (written to .dev.vars inside the container, never argv).
      # The Worker accepts plain HTTP on loopback only, so a relay inside the
      # container forwards 127.0.0.1:10000 to the API (origin-relay.mjs).
      RENDER_ORIGIN: http://127.0.0.1:10000
      ATUS_EDGE_RELAY_TARGET: api:10000
      EDGE_AUTH_SECRET: ${ATUS_STACK_EDGE_SECRET:?set it in the stack env file (deploy/stack/stack.env.example)}
      OPS_TOKEN: ${ATUS_STACK_EDGE_OPS_TOKEN:-}
      IP_HMAC_KEY: ${ATUS_STACK_IP_HMAC_KEY:-}
      # Worker vars that deploy.yml publishes; empty ones keep wrangler.jsonc
      # (an empty DATA_VERSION or ANALYTICS_VERSION turns the KV cache off).
      DATA_VERSION: ${ATUS_EXPECTED_DATA_VERSION:-}
      ANALYTICS_VERSION: ${ATUS_STACK_ANALYTICS_VERSION:-}
      RESPONSE_FORMAT: ${ATUS_STACK_RESPONSE_FORMAT:-}
      SNAPSHOT_ID: ${ATUS_STACK_SNAPSHOT_ID:-}
      WRANGLER_SEND_METRICS: "false"
    volumes:
      - type: bind
        source: ${ATUS_STACK_ASSETS_DIR:-./frontend/dist}
        target: /work/frontend/dist
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${ATUS_STACK_EDGE_PORT-8541}:8787"
    healthcheck:
      # The Worker's own /api/_edge/health: answered at the edge, never the API.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/_edge/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s

  smoke:
    profiles: ["smoke"]
    image: *api-image
    pull_policy: never
    depends_on:
      api:
        condition: service_healthy
    environment:
      ATUS_SMOKE_EDGE_SECRET: ${ATUS_STACK_EDGE_SECRET:?set it in the stack env file (deploy/stack/stack.env.example)}
      # The API's ops bearer, so the probe can prove /ready and /metrics open with it.
      ATUS_SMOKE_OPS_TOKEN: ${ATUS_STACK_OPS_TOKEN:?set it in the stack env file (deploy/stack/stack.env.example)}
    entrypoint: ["python", "/workspace/deploy/stack/smoke_probe.py"]
    command: []
    volumes:
      - ./deploy/stack:/workspace/deploy/stack:ro
    read_only: true
    healthcheck:
      disable: true

volumes:
  pgdata:
