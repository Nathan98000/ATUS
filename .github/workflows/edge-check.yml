# Edge monitor (ADR-011 "Keep-alive policy", ADR-014): every 30 minutes, at
# :17 and :47 (off the hour, when GitHub's scheduler is busiest).
#
# Four requests to the public origin: the static SPA shell with its security
# headers, the Worker's own /api/_edge/health, and the static snapshot (its
# pointer and manifest). Only /api/_edge/health invokes the Worker (48 Worker
# requests a day); nothing reaches Render or Neon, so this never wakes them.
#
# A failure emails the owner: GitHub notifies about failed scheduled runs, with
# Settings -> Notifications -> System -> Actions set to "Email" and "Only
# notify for failed workflows" (docs/deployment.md, owner step 4.3). Skipped
# until the repository variable PUBLIC_BASE_URL is set (before the first deploy).
name: Edge check

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-check
  cancel-in-progress: false

jobs:
  edge:
    name: Static shell, edge health, snapshot
    if: ${{ vars.PUBLIC_BASE_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the monitor scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ops

      - name: Check the edge (standard library only; no install)
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: python3 scripts/ops/monitors.py edge
