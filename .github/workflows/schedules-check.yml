# Monthly schedule check and owner reminder (ADR-011 "Risks": GitHub disables
# scheduled workflows "when no repository activity has occurred in 60 days",
# and scheduled runs can be delayed or dropped).
#
# Fails loudly, and so emails the owner, when a scheduled workflow is not
# active, when a monitor has stopped running, or when the repository has had
# no push for 28 days (the next monthly run would come after the 60-day
# cutoff). It reads workflow and run metadata through the GitHub REST API (the
# endpoints `gh api` calls) with the run's read-only token. If this workflow is
# itself disabled it cannot alert: a monthly look at the Actions tab is the
# backstop (docs/deployment.md, "Monitoring and alerting").
name: Schedules check

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schedules-check
  cancel-in-progress: false

jobs:
  schedules:
    name: Scheduled workflows are enabled and running
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the ops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ops

      - name: Check every scheduled workflow and the repository's activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ops/github_ops.py schedules --repo "$GITHUB_REPOSITORY"

      - name: Monthly reminder
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Monthly owner checklist (docs/deployment.md, "Monitoring and alerting")
          - The Cloudflare API token expires 90 days after creation: rotate it before then.
          - Quota reports: any warning this month? Neon CU-hours and egress on the Neon console.
          - Render: no suspension or card notice; the service is still on the Free plan.
          - GitHub: Actions notifications still set to email on failed workflows.
          EOF
