# Daily quota report (ADR-011 "Quota governor: Visibility", ADR-015): fails, and
# so emails the owner, when any provider budget is above 70% of its pro-rated
# value.
#
# One request: GET /api/_ops/budget with the Worker's OPS_TOKEN (GitHub secret
# EDGE_OPS_TOKEN in the `ops` environment). The Worker answers from the quota
# governor's own storage; nothing reaches Render or Neon. Runs at 22:05 UTC, so
# the governor's daily counters (reset at 00:00 UTC) cover most of the day and
# a delayed run still lands before the reset.
#
# With the optional `ops` secrets CLOUDFLARE_ANALYTICS_TOKEN (read-only,
# Account Analytics: Read) and CLOUDFLARE_ANALYTICS_ACCOUNT, one more request
# to Cloudflare's GraphQL Analytics API judges the account's Worker requests
# today against Workers Free's 100,000 a day. Render's outbound bandwidth has
# no monitor (it needs an account-wide Render API key): the weekly
# schedules-check summary reminds the owner to look at it.
name: Quota report

on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quota-report
  cancel-in-progress: false

jobs:
  quota:
    name: Governor budgets against their pro-rated quotas
    if: ${{ vars.PUBLIC_BASE_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ops
    permissions:
      contents: read
    steps:
      - name: Check out the monitor scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ops

      - name: Read and judge the budgets (the token is read from the environment, never printed)
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          EDGE_OPS_TOKEN: ${{ secrets.EDGE_OPS_TOKEN }}
          # Optional (owner step 4.3): a read-only "Account Analytics: Read"
          # token and the account id, for the Worker requests line.
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ANALYTICS_ACCOUNT: ${{ secrets.CLOUDFLARE_ANALYTICS_ACCOUNT }}
        run: python3 scripts/ops/monitors.py quota --threshold 0.7
