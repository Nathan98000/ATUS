name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atus
          POSTGRES_PASSWORD: atus
          POSTGRES_DB: atus
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U atus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (disposable test database)
        run: pytest tests/integration -q
        env:
          ATUS_TEST_DATABASE_URL: postgresql://atus:atus@localhost:5434/atus_test
