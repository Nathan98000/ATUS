# Continuous integration: every pull request and every push to main.
#
# Deploys nothing and pushes nothing: deploy.yml is the only deploy path
# (tags and manual runs, behind the `production` environment's reviewer).
# Every third-party action is pinned to a full commit SHA (the version is in
# the comment; Dependabot keeps both current). Jobs:
#
#   backend      ruff, unit, deployment-file and integration tests on Python
#                3.11 and 3.12 (hash-locked install, postgres:16 service);
#                OpenAPI drift (3.12)
#   supply-chain pip-audit of the API image's runtime lock; actionlint
#   frontend     typecheck, lint, format, Vitest, production build, bundle
#                guard, API-type drift, npm audit
#   edge         the Worker: typecheck, lint, format, tests (incl. the
#                wrangler.jsonc invariants), npm audit
#   image        image.yml: build once, strict gate, deployment tests, stack
#                smoke (plain and free-tier emulation), Trivy
#   e2e          Playwright, every project (Chromium, mobile, Firefox, WebKit),
#                against the vite-preview build and the real API
#   e2e-stack    the tested image in the production compose stack behind the
#                edge Worker (wrangler dev): HTTP smoke + a browser journey
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        # postgres:16 (16.15), pinned by digest like docker-compose.prod.yml.
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          # A throwaway, runner-local database for the disposable test
          # databases the suites create; not a secret.
          POSTGRES_USER: atus
          POSTGRES_PASSWORD: atus
          POSTGRES_DB: atus
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U atus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ATUS_TEST_DATABASE_URL: postgresql://atus:atus@localhost:5434/atus_test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt

      - name: Install the hash-locked dev environment
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/dev.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests/unit -q -p no:cacheprovider

      - name: Deployment-file tests (static; container tests run in the image job)
        run: python -m pytest tests/deploy -q -p no:cacheprovider

      - name: Integration tests (disposable databases on the postgres:16 service)
        run: python -m pytest tests/integration -q -p no:cacheprovider

      - name: OpenAPI drift (frontend/openapi.json is what the API serves)
        if: matrix.python == '3.12'
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- frontend/openapi.json

  supply-chain:
    name: Supply chain (pip-audit, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-tools.lock.txt

      - name: Install the hash-locked CI tools in their own environment
        run: |
          python -m venv "$RUNNER_TEMP/ci-tools"
          "$RUNNER_TEMP/ci-tools/bin/python" -m pip install --require-hashes --no-deps \
            -r requirements/ci-tools.lock.txt
          echo "$RUNNER_TEMP/ci-tools/bin" >> "$GITHUB_PATH"

      - name: pip-audit of the API image's runtime lock
        run: pip-audit --strict --require-hashes --disable-pip -r requirements/api.lock.txt

      - name: Install actionlint (pinned version, verified checksum)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: actionlint (workflow syntax, expressions, ShellCheck on every run step)
        run: actionlint -color

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (lockfile only)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: API types match openapi.json (F30 drift check)
        run: npm run check:api-types

      - name: Unit and component tests
        run: npm test

      - name: Production build (same-origin, no VITE_API_BASE_URL)
        run: npm run build

      - name: Bundle guard (no dev API address, CSP-safe HTML, _headers rules)
        run: npm run check:bundle

      - name: npm audit (runtime dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high

  edge:
    name: Edge Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: edge
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: edge/package-lock.json

      - name: Install (lockfile only; wrangler is pinned here)
        run: npm ci

      - name: Typecheck (generates worker-configuration.d.ts first)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Tests (workerd via Miniflare, plus the wrangler.jsonc invariants)
        run: npm test

      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev

  image:
    name: Image
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
    with:
      build-sha: ${{ github.sha }}
      use-cache: true

  e2e:
    name: E2E (vite preview, all browsers)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: atus
          POSTGRES_PASSWORD: atus
          POSTGRES_DB: atus
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U atus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "1"
      E2E_BACKEND_PYTHON: python
      ATUS_E2E_DATABASE_URL: postgresql://atus:atus@localhost:5434/atus_e2e
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt

      - name: Install the backend (hash-locked)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/dev.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend (lockfile only)
        working-directory: frontend
        run: npm ci

      - name: Install the Playwright browsers and their system packages
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (real API on the fixture database; every project)
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep the Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  e2e-stack:
    name: E2E through the edge Worker (production compose stack)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ATUS_STACK_IMAGE: atus-api:ci
      ATUS_STACK_PULL_POLICY: missing
      STACK_PROJECT: atus-ci-edge-${{ github.run_id }}
      EDGE_URL: http://127.0.0.1:8541
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atus-api-image
          path: ${{ runner.temp }}/image

      - name: Load it (and prove it is the image the image job tested)
        run: |
          docker load -i "$RUNNER_TEMP/image/atus-api.tar"
          loaded=$(docker image inspect --format '{{.Id}}' "$ATUS_STACK_IMAGE")
          test "$loaded" = "$(cat "$RUNNER_TEMP/image/atus-api.id")"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the SPA as deployed (same-origin) and guard the bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run check:bundle

      - name: Start db, seed (fixture), API and the edge Worker (wrangler dev, local mode)
        run: |
          umask 077
          env_file="$RUNNER_TEMP/stack.env"
          secret() { openssl rand -hex 24; }
          {
            echo "ATUS_STACK_PG_SUPERUSER_PASSWORD=$(secret)"
            echo "ATUS_STACK_OWNER_PASSWORD=$(secret)"
            echo "ATUS_STACK_API_DB_PASSWORD=$(secret)"
            echo "ATUS_STACK_EDGE_SECRET=$(secret)"
            echo "ATUS_STACK_OPS_TOKEN=$(secret)"
            echo "ATUS_STACK_EDGE_OPS_TOKEN=$(secret)"
            echo "ATUS_STACK_IP_HMAC_KEY=$(secret)"
            echo "ATUS_STACK_DB_PORT="
            echo "ATUS_STACK_PGBOUNCER_PORT="
            echo "ATUS_STACK_EDGE_PORT=8541"
            echo "ATUS_BUILD_SHA=$GITHUB_SHA"
          } > "$env_file"
          docker compose -p "$STACK_PROJECT" --env-file "$env_file" -f docker-compose.prod.yml \
            --profile edge up -d --wait --wait-timeout 600 edge
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null "$EDGE_URL/api/_edge/health"; then exit 0; fi
            sleep 2
          done
          echo "the edge Worker never answered /api/_edge/health" >&2
          exit 1

      - name: HTTP smoke through the Worker (headers, health, meta, a live analysis)
        run: python scripts/ops/deploy_smoke.py --base-url "$EDGE_URL" --expect-build "$GITHUB_SHA" --max-requests 30 --wake-timeout 120

      - name: Install Chromium for the browser journey
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser journey through the Worker (a starter analysis renders, no CSP errors)
        working-directory: frontend
        env:
          PUBLIC_BASE_URL: ${{ env.EDGE_URL }}
        run: npx playwright test -c playwright.deployed.config.ts

      # TODO(integrator): run the whole Playwright suite through the edge stack
      # once playwright.config.ts gains its stack-mode switch (a base URL that
      # skips the vite-preview and e2e_backend web servers). Until then this
      # job proves the stack with the HTTP smoke and one browser journey, and
      # the full suite runs against vite preview in the e2e job.
      - name: Full Playwright suite through the edge stack (pending a stack-mode switch)
        run: echo "::notice title=E2E through the edge::the full suite through the edge stack is pending the playwright.config.ts stack-mode switch (TODO in ci.yml)"

      - name: Stack logs
        if: ${{ failure() }}
        run: |
          if [ -f "$RUNNER_TEMP/stack.env" ]; then
            docker compose -p "$STACK_PROJECT" --env-file "$RUNNER_TEMP/stack.env" \
              -f docker-compose.prod.yml --profile edge logs --no-color --tail 200
          fi

      - name: Keep the Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-e2e-stack
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove the stack
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/stack.env" ]; then
            docker compose -p "$STACK_PROJECT" --env-file "$RUNNER_TEMP/stack.env" \
              -f docker-compose.prod.yml --profile edge down -v --remove-orphans
          fi
