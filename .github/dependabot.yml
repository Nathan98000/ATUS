# Dependabot version updates (brief §11 supply chain; free for public repos).
# Security updates and alerts are switched on in the repository settings
# (docs/deployment.md, owner step 4.4).
#
# Every ecosystem waits 7 days after a release before proposing it (cooldown),
# so a freshly published malicious version has time to be pulled first, and
# groups minor and patch bumps into one weekly PR per ecosystem. Every PR runs
# the full CI (ci.yml), including the image scan.
#
# Notes for reviewers:
# - pip: the hash-locked files under requirements/ are generated. If a PR edits
#   one lock but not the others, tests/deploy/test_requirements_locks.py fails;
#   regenerate with requirements/compile.sh (--upgrade-package <name>) and push
#   to the PR branch.
# - github-actions: actions are pinned by commit SHA with the version in a
#   comment; Dependabot updates both.
# - docker: every Dockerfile has literal, digest-pinned FROM lines. The API
#   Dockerfile also repeats its base in two ARGs for the OCI labels: update
#   them with the FROM lines (tests/deploy/test_dependabot.py checks).
version: 2

updates:
  - package-ecosystem: pip
    directories:
      - "/"
      - "/requirements"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: npm
    directory: "/edge"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      edge-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(edge)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"

  # postgres:16 is pinned by the same digest in the compose files (bumped by
  # the docker-compose entry below), deploy/pgbouncer/Dockerfile (this entry),
  # and copies no ecosystem updates: the `services:` images of ci.yml and
  # deploy.yml, deploy/ci/check_image.py, tests/deploy/test_container_image.py
  # and src/atus_pipeline/serving/pgtools.py (the restore's docker client).
  # A pull request that bumps one copy fails
  # tests/deploy/test_dependabot.py::test_every_postgres_16_pin_names_the_same_digest
  # until every copy carries the new digest: update them in the same pull request.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy/edge"
      - "/deploy/pgbouncer"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(compose)"
